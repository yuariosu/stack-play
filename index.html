<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>STACK 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Space+Mono:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;
  background:#05050f;
  font-family:'Inter',sans-serif;color:#e8e4f0;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  touch-action:manipulation}

/* ── HUD ─────────────────────────────────────────── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}

#score-wrap{
  position:absolute;top:22px;left:50%;transform:translateX(-50%);
  text-align:center}
#score-val{
  font-family:'Space Mono',monospace;
  font-size:clamp(3rem,12vw,6rem);font-weight:700;line-height:1;
  background:linear-gradient(160deg,#ede9fe 0%,#a78bfa 40%,#7c3aed 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 22px rgba(167,139,250,.6));
  transition:transform .13s cubic-bezier(.34,1.56,.64,1)}
#score-val.pop{transform:scale(1.3)}

#best-wrap{position:absolute;top:22px;right:20px;text-align:right}
#best-label{
  font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(232,228,240,.3);margin-bottom:2px}
#best-val{
  font-family:'Space Mono',monospace;font-size:1.4rem;font-weight:700;
  color:#f59e0b;filter:drop-shadow(0 0 10px rgba(245,158,11,.45))}

/* ── Screens ─────────────────────────────────────── */
.screen{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:20;
  transition:opacity .4s ease,visibility .4s ease}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none}

/* ── Start screen ────────────────────────────────── */
#start-screen{background:transparent}

/* Particle canvas behind everything on start */
#start-canvas{
  position:fixed;inset:0;z-index:19;pointer-events:none;
  opacity:1;transition:opacity .6s ease}
#start-canvas.gone{opacity:0}

/* Glass card */
.glass-card{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  padding:52px 44px 48px;
  background:linear-gradient(145deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.03) 100%);
  border:1px solid rgba(255,255,255,.13);
  border-radius:28px;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:
    0 0 0 1px rgba(167,139,250,.15) inset,
    0 40px 80px rgba(0,0,0,.5),
    0 0 120px rgba(124,58,237,.12);
  max-width:340px;width:calc(100vw - 48px);
  overflow:hidden}

/* shimmer sweep */
.glass-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.06) 50%,transparent 62%);
  background-size:200% 100%;
  animation:shimmer 3.5s ease-in-out infinite;
  pointer-events:none;border-radius:inherit}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* logo mark */
.logo-wrap{
  width:72px;height:72px;margin-bottom:28px;
  background:linear-gradient(145deg,rgba(124,58,237,.25),rgba(109,40,217,.1));
  border:1px solid rgba(167,139,250,.3);
  border-radius:20px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 30px rgba(124,58,237,.2);
  position:relative;overflow:hidden}
.logo-wrap::after{
  content:'';position:absolute;inset:-2px;
  background:linear-gradient(135deg,rgba(167,139,250,.3),transparent 60%);
  border-radius:inherit;animation:logoPulse 2.4s ease-in-out infinite}
@keyframes logoPulse{0%,100%{opacity:.6}50%{opacity:1}}

.game-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(3.2rem,14vw,5.5rem);font-weight:700;
  letter-spacing:.08em;line-height:1;
  background:linear-gradient(145deg,#ede9fe 0%,#c4b5fd 35%,#a78bfa 65%,#7c3aed 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 30px rgba(167,139,250,.5));
  margin-bottom:10px;text-align:center}

.divider{
  width:40px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(167,139,250,.6),transparent);
  margin:16px auto 20px}

.game-sub{
  font-size:14px;font-weight:400;letter-spacing:.01em;
  color:rgba(232,228,240,.5);margin-bottom:40px;
  text-align:center;line-height:1.8;max-width:220px}

/* CTA button */
.btn-primary{
  font-family:'Inter',sans-serif;font-size:15px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  color:#fff;border:none;cursor:pointer;
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#7c3aed 0%,#6d28d9 100%);
  border-radius:100px;padding:17px 56px;
  box-shadow:
    0 0 0 1px rgba(167,139,250,.3) inset,
    0 0 50px rgba(124,58,237,.45),
    0 8px 32px rgba(0,0,0,.4);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),
             box-shadow .22s ease}
.btn-primary::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.15) 0%,transparent 60%);
  border-radius:inherit}
.btn-primary::after{
  content:'';position:absolute;top:-50%;left:-60%;
  width:40%;height:200%;
  background:rgba(255,255,255,.12);
  transform:rotate(25deg) translateX(-100%);
  transition:transform .6s ease}
.btn-primary:hover{
  transform:scale(1.06);
  box-shadow:0 0 0 1px rgba(167,139,250,.4) inset,0 0 70px rgba(124,58,237,.7),0 12px 40px rgba(0,0,0,.5)}
.btn-primary:hover::after{transform:rotate(25deg) translateX(500%)}
.btn-primary:active{transform:scale(.96)}

/* corner accents */
.corner{position:absolute;width:18px;height:18px;opacity:.4}
.corner-tl{top:16px;left:16px;border-top:1px solid #a78bfa;border-left:1px solid #a78bfa}
.corner-tr{top:16px;right:16px;border-top:1px solid #a78bfa;border-right:1px solid #a78bfa}
.corner-bl{bottom:16px;left:16px;border-bottom:1px solid #a78bfa;border-left:1px solid #a78bfa}
.corner-br{bottom:16px;right:16px;border-bottom:1px solid #a78bfa;border-right:1px solid #a78bfa}

/* ── Game Over screen ────────────────────────────── */
#gameover-screen{
  background:rgba(5,5,15,.88);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

.go-card{
  display:flex;flex-direction:column;align-items:center;
  padding:48px 44px 44px;
  background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.1);
  border-radius:28px;
  box-shadow:0 0 0 1px rgba(251,191,36,.08) inset,0 40px 80px rgba(0,0,0,.5);
  max-width:320px;width:calc(100vw - 48px);
  position:relative;overflow:hidden}
.go-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.04) 50%,transparent 62%);
  background-size:200% 100%;
  animation:shimmer 4s ease-in-out infinite;pointer-events:none}

.go-eyebrow{
  font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(232,228,240,.3);margin-bottom:8px}
.go-score-val{
  font-family:'Space Mono',monospace;
  font-size:clamp(4.5rem,18vw,10rem);font-weight:700;line-height:1;margin-bottom:8px;
  background:linear-gradient(145deg,#fde68a,#f59e0b,#ef4444);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 25px rgba(245,158,11,.4))}
.go-best-msg{
  font-size:13px;font-weight:500;color:#f59e0b;
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:40px;min-height:22px;
  filter:drop-shadow(0 0 8px rgba(245,158,11,.5))}

/* ── Perfect label ───────────────────────────────── */
#perfect{
  position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2.2rem,8vw,4rem);font-weight:700;letter-spacing:.12em;
  color:#a7f3d0;
  filter:drop-shadow(0 0 20px rgba(52,211,153,.9)) drop-shadow(0 0 60px rgba(52,211,153,.4));
  pointer-events:none;z-index:30;opacity:0}
#perfect.show{animation:pfx 1s cubic-bezier(.22,1,.36,1) forwards}
@keyframes pfx{
  0%{opacity:0;transform:translate(-50%,-24%) scale(.5) rotateX(20deg)}
  16%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotateX(0)}
  55%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-72%) scale(.92)}}

/* ── In-game hint ────────────────────────────────── */
#hint{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(232,228,240,.25);z-index:10;pointer-events:none;
  animation:blink 2.6s ease-in-out infinite}
#hint.gone{display:none}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:.8}}

/* ── Speed bar ───────────────────────────────────── */
#spd-wrap{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:0 0 6px}
#spd-label{
  text-align:center;font-size:9px;font-weight:500;letter-spacing:.15em;
  text-transform:uppercase;color:rgba(232,228,240,.3);margin-bottom:3px}
#spd{height:4px;background:rgba(255,255,255,.06);margin:0 20px;border-radius:2px}
#spd-fill{
  height:100%;width:8%;border-radius:2px;
  background:linear-gradient(90deg,#6d28d9,#a78bfa,#c4b5fd);
  box-shadow:0 0 12px rgba(167,139,250,1),0 0 30px rgba(124,58,237,.5);
  transition:width .6s ease}

/* ── Controls (mute / pause) ─────────────────────── */
#controls{
  position:fixed;top:18px;left:18px;display:flex;gap:10px;z-index:10;
  pointer-events:auto}
.ctrl-btn{
  width:38px;height:38px;border:none;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid rgba(167,139,250,.2);
  border-radius:10px;color:rgba(232,228,240,.6);font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .15s;backdrop-filter:blur(8px)}
.ctrl-btn:hover{background:rgba(167,139,250,.18);color:#e8e4f0;transform:scale(1.08)}
.ctrl-btn:active{transform:scale(.92)}
.ctrl-btn.muted{color:rgba(232,228,240,.25)}

/* ── Combo counter ───────────────────────────────── */
#combo{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.4rem,5vw,2.2rem);font-weight:700;letter-spacing:.1em;
  color:#fde68a;
  filter:drop-shadow(0 0 14px rgba(251,191,36,.8));
  pointer-events:none;z-index:30;opacity:0;top:52%}
#combo.show{animation:combofx .9s cubic-bezier(.22,1,.36,1) forwards}
@keyframes combofx{
  0%{opacity:0;transform:translate(-50%,0%) scale(.7)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-70%) scale(.95)}}

/* ── Zone flash ──────────────────────────────────── */
#zone-flash{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  pointer-events:none;z-index:28;opacity:0}
#zone-flash.show{animation:zonefx 2.2s cubic-bezier(.22,1,.36,1) forwards}
.zone-emoji{font-size:clamp(2.5rem,8vw,4.5rem);margin-bottom:8px}
.zone-name{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.8rem,7vw,3.2rem);font-weight:700;letter-spacing:.14em;
  color:#e8e4f0;filter:drop-shadow(0 0 30px rgba(255,255,255,.5))}
@keyframes zonefx{
  0%{opacity:0;transform:scale(.7)}
  15%{opacity:1;transform:scale(1.06)}
  35%{opacity:1;transform:scale(1)}
  75%{opacity:1}
  100%{opacity:0;transform:scale(.95) translateY(-20px)}}

/* ── Block type badge ────────────────────────────── */
#block-next{
  position:fixed;top:88px;right:20px;z-index:10;
  text-align:right;pointer-events:none}
#block-next-label{
  font-size:8px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(232,228,240,.25);margin-bottom:4px}
#block-type-badge{
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  letter-spacing:.12em;padding:5px 10px;
  border:1px solid currentColor;border-radius:6px;
  display:inline-block;transition:all .3s ease}
#block-type-badge.hidden{opacity:0;transform:scale(.8)}
#block-type-badge.pop{animation:badgepop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes badgepop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ── Altitude gauge ──────────────────────────────── */
#altitude-gauge{
  position:fixed;right:20px;top:50%;transform:translateY(-50%);
  width:4px;height:min(280px,40vh);
  background:rgba(255,255,255,.05);border-radius:2px;z-index:10;
  pointer-events:none}
#alt-fill{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(to top,#7c3aed,#22d3ee,#4ade80,#fbbf24,#f0f0f0);
  border-radius:2px;transition:height .6s ease;height:0%}
.alt-mark{
  position:absolute;left:8px;font-size:8px;letter-spacing:.1em;
  color:rgba(232,228,240,.25);white-space:nowrap;transform:translateY(50%)}
.alt-mark::before{
  content:'';position:absolute;left:-10px;top:50%;width:6px;height:1px;
  background:rgba(232,228,240,.2);transform:translateY(-50%)}

/* ── Lean danger ring ────────────────────────────── */
#lean-ring{
  position:fixed;inset:4px;border-radius:16px;
  border:2px solid transparent;z-index:9;pointer-events:none;
  transition:border-color .3s,box-shadow .3s;opacity:0}

/* ── Wind warning ────────────────────────────────── */
#wind-warn{
  position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);
  font-family:'Space Mono',monospace;font-size:clamp(.9rem,3vw,1.3rem);
  font-weight:700;letter-spacing:.2em;
  color:#38bdf8;filter:drop-shadow(0 0 16px rgba(56,189,248,.8));
  pointer-events:none;z-index:30;opacity:0}
#wind-warn.show{animation:windfx 1.4s ease forwards}
@keyframes windfx{
  0%{opacity:0;transform:translate(-50%,-60%) scale(.8)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  70%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-40%)}}

/* ── Milestone celebration ───────────────────────── */
#milestone{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
  pointer-events:none;z-index:29;opacity:0}
#milestone.show{animation:milestonefx 2.8s cubic-bezier(.22,1,.36,1) forwards}
#milestone-emoji{font-size:clamp(3rem,12vw,6rem)}
#milestone-text{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.4rem,5vw,2.4rem);font-weight:700;letter-spacing:.1em;
  background:linear-gradient(135deg,#fde68a,#f59e0b,#fde68a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 20px rgba(251,191,36,.6))}
@keyframes milestonefx{
  0%{opacity:0;transform:scale(.5)}
  18%{opacity:1;transform:scale(1.08)}
  35%{opacity:1;transform:scale(1)}
  72%{opacity:1}
  100%{opacity:0;transform:translateY(-30px) scale(.95)}}

/* ── Pause overlay ───────────────────────────────── */
#pause-overlay{
  position:fixed;inset:0;z-index:25;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(5,5,15,.75);backdrop-filter:blur(12px);
  transition:opacity .3s,visibility .3s}
#pause-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.pause-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2.5rem,10vw,4rem);font-weight:700;
  letter-spacing:.12em;
  background:linear-gradient(145deg,#ede9fe,#a78bfa,#7c3aed);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 24px rgba(167,139,250,.5));
  margin-bottom:32px}
.pause-hint{
  font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(232,228,240,.35);margin-top:20px}

/* ── Countdown overlay ───────────────────────────── */
#countdown{
  position:fixed;inset:0;z-index:25;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none}
#countdown.hidden{display:none}
#countdown-val{
  font-family:'Space Mono',monospace;
  font-size:clamp(6rem,25vw,12rem);font-weight:700;line-height:1;
  background:linear-gradient(145deg,#ede9fe 0%,#a78bfa 40%,#7c3aed 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 40px rgba(167,139,250,.7));
  animation:cdpop .7s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes cdpop{
  0%{transform:scale(1.8);opacity:0}
  30%{opacity:1;transform:scale(1)}
  80%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(.7)}}

/* ── Game over – stats row ───────────────────────── */
.go-stats{
  display:flex;gap:24px;margin-bottom:28px;margin-top:-8px}
.go-stat{text-align:center}
.go-stat-label{
  font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(232,228,240,.28);margin-bottom:4px}
.go-stat-val{
  font-family:'Space Mono',monospace;font-size:1.5rem;font-weight:700;
  color:#c4b5fd;filter:drop-shadow(0 0 8px rgba(167,139,250,.4))}
.go-stat-val.gold{color:#f59e0b;filter:drop-shadow(0 0 8px rgba(245,158,11,.4))}

/* ── High score list ─────────────────────────────── */
.go-scores{
  width:100%;margin-bottom:28px;
  border-top:1px solid rgba(255,255,255,.06);
  padding-top:16px}
.go-scores-title{
  font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(232,228,240,.25);margin-bottom:10px;text-align:center}
.go-score-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:3px 0;font-size:12px}
.go-score-rank{color:rgba(232,228,240,.3);font-size:10px;width:20px}
.go-score-num{
  font-family:'Space Mono',monospace;font-weight:700;
  color:rgba(232,228,240,.7)}
.go-score-row.current .go-score-num{color:#fde68a}
.go-score-row.current .go-score-rank{color:#fde68a}

/* ── Debug ───────────────────────────────────────── */
#dbg{position:fixed;top:0;left:0;z-index:9999;
  background:rgba(0,0,0,.7);color:#0f0;
  font:11px/1.6 monospace;padding:4px 8px;pointer-events:none;white-space:pre}
</style>
</head>
<body>

<!-- Particle background (start screen only) -->
<canvas id="start-canvas"></canvas>

<div id="hud">
  <div id="score-wrap"><div id="score-val">0</div></div>
  <div id="best-wrap">
    <div id="best-label">BEST</div>
    <div id="best-val">0</div>
  </div>
</div>
<div id="controls">
  <button class="ctrl-btn" id="btn-mute" title="ミュート">🔊</button>
  <button class="ctrl-btn" id="btn-pause" title="ポーズ" style="display:none">⏸</button>
</div>
<div id="perfect">PERFECT</div>
<div id="combo"></div>
<div id="hint">タップ / スペースで止める</div>
<div id="spd-wrap">
  <div id="spd-label">SPEED</div>
  <div id="spd"><div id="spd-fill"></div></div>
</div>

<!-- Block type next indicator -->
<div id="block-next">
  <div id="block-next-label">NEXT</div>
  <div id="block-type-badge" class="hidden"></div>
</div>

<!-- Altitude gauge (right side) -->
<div id="altitude-gauge">
  <div id="alt-fill"></div>
  <div class="alt-mark" style="bottom:0%">0</div>
  <div class="alt-mark" style="bottom:10%">10</div>
  <div class="alt-mark" style="bottom:25%">25</div>
  <div class="alt-mark" style="bottom:50%">50</div>
  <div class="alt-mark" style="bottom:100%">100</div>
</div>

<!-- Lean danger ring -->
<div id="lean-ring"></div>

<!-- Zone flash -->
<div id="zone-flash">
  <div class="zone-emoji" id="zone-emoji"></div>
  <div class="zone-name" id="zone-name"></div>
</div>

<!-- Wind warning -->
<div id="wind-warn">💨 WIND!</div>

<!-- Milestone celebration -->
<div id="milestone">
  <div id="milestone-emoji"></div>
  <div id="milestone-text"></div>
</div>

<div id="dbg"></div>

<!-- Pause overlay -->
<div id="pause-overlay" class="hidden">
  <div class="pause-title">PAUSED</div>
  <button class="btn-primary" id="btn-resume">再開</button>
  <div class="pause-hint">ESC / P でも再開</div>
</div>

<!-- Countdown overlay -->
<div id="countdown" class="hidden">

// ── Particle bg (2D canvas, start screen) ──────────────────────
{
  const c = startCvs, cx = c.getContext('2d');
  let W, H, pts = [];

  function resizePts() {
    W = c.width  = innerWidth;
    H = c.height = innerHeight;
  }
  resizePts();
  window.addEventListener('resize', resizePts);

  const N = 80;
  for (let i = 0; i < N; i++) pts.push({
    x: Math.random() * 2000, y: Math.random() * 2000,
    vx: (Math.random() - .5) * 18,
    vy: (Math.random() - .5) * 18,
    r: .6 + Math.random() * 1.8,
    a: Math.random(),
    hue: 250 + Math.random() * 40
  });

  let lastPt = 0;
  function animPts(ts) {
    if (startCvs.classList.contains('gone')) return;
    requestAnimationFrame(animPts);
    const dt = Math.min((ts - lastPt) / 1000, .05); lastPt = ts;
    cx.clearRect(0, 0, W, H);

    // draw connections
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 130) {
          cx.strokeStyle = `hsla(${pts[i].hue},70%,70%,${(1 - dist/130) * .12})`;
          cx.lineWidth = .5;
          cx.beginPath(); cx.moveTo(pts[i].x, pts[i].y); cx.lineTo(pts[j].x, pts[j].y); cx.stroke();
        }
      }
    }

    for (const p of pts) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < 0) p.x += W; if (p.x > W) p.x -= W;
      if (p.y < 0) p.y += H; if (p.y > H) p.y -= H;
      p.a = .35 + .35 * Math.sin(ts * .001 + p.x);
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      cx.fillStyle = `hsla(${p.hue},80%,75%,${p.a})`;
      cx.fill();
    }
  }
  requestAnimationFrame(animPts);
}

// ── Block mesh factory (luxury materials) ─────────────────────
function blockY(idx) { return idx * (BH + GAP) + BH / 2; }

function makeMesh(w, d, ci, isSlider = false) {
  const p = PAL[ci % PAL.length];

  // Top face — glossy clearcoat
  const topMat = new THREE.MeshPhysicalMaterial({
    color: p.top,
    roughness: 0.15,
    metalness: 0.35,
    clearcoat: 1.0,
    clearcoatRoughness: 0.08,
    reflectivity: 0.9,
    envMapIntensity: 1.0,
  });

  // Side face — slightly matte with subtle sheen
  const sideMat = new THREE.MeshPhysicalMaterial({
    color: p.side,
    roughness: 0.45,
    metalness: 0.2,
    clearcoat: 0.3,
    clearcoatRoughness: 0.3,
    sheen: 0.4,
    sheenRoughness: 0.5,
    sheenColor: new THREE.Color(p.top),
  });

  if (isSlider) {
    topMat.emissive = new THREE.Color(p.em);
    topMat.emissiveIntensity = 0.4;
  }

  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, BH, d),
    [sideMat, sideMat, topMat, sideMat, sideMat, sideMat]
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  // Edge highlight — thin inset line
  if (w > 0.1 && d > 0.1) {
    const edge = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(w, BH, d)),
      new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12 })
    );
    mesh.add(edge);
  }

  return mesh;
}

function disposeMesh(mesh) {
  if (!mesh) return;
  mesh.traverse(child => {
    child.geometry?.dispose();
    const mats = Array.isArray(child.material) ? child.material : [child.material];
    mats.forEach(m => m?.dispose());
  });
  mesh.removeFromParent();
}

// ── Particles ──────────────────────────────────────────────────
const pGeo = new THREE.SphereGeometry(0.07, 5, 5);

function burst(cx, cy, cz, colorHex, n) {
  for (let i = 0; i < n; i++) {
    const mat  = new THREE.MeshBasicMaterial({ color: colorHex });
    const mesh = new THREE.Mesh(pGeo, mat);
    mesh.position.set(cx, cy, cz);
    scene.add(mesh);
    const a = Math.random() * Math.PI * 2;
    const s = 1.5 + Math.random() * 4.5;
    particles.push({
      mesh, mat,
      vx: Math.cos(a) * s, vy: 1.8 + Math.random() * 3.5, vz: Math.sin(a) * s,
      life: 0.55 + Math.random() * 0.65
    });
  }
}

function tickParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy -= 10 * dt;
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.life -= dt;
    if (p.life <= 0) { p.mesh.removeFromParent(); p.mat.dispose(); particles.splice(i, 1); }
  }
}

// ── Fallers ────────────────────────────────────────────────────
function spawnFaller(cx, cy, cz, w, d, ci) {
  if (w < 0.01 || d < 0.01) return;
  const mesh = makeMesh(Math.max(w, 0.05), Math.max(d, 0.05), ci, false);
  mesh.position.set(cx, cy, cz);
  scene.add(mesh);
  fallers.push({ mesh, vy: -(0.3 + Math.random() * 0.8), rx: (Math.random()-.5)*3, rz: (Math.random()-.5)*3, elapsed: 0 });
}

function tickFallers(dt) {
  for (let i = fallers.length - 1; i >= 0; i--) {
    const f = fallers[i];
    f.elapsed += dt; f.vy -= 9 * dt;
    f.mesh.position.y += f.vy * dt;
    f.mesh.rotation.x += f.rx * dt;
    f.mesh.rotation.z += f.rz * dt;
    if (f.mesh.position.y < -14 || f.elapsed > 2.8) { disposeMesh(f.mesh); fallers.splice(i, 1); }
  }
}

// ── Stars ──────────────────────────────────────────────────────
function initStars() {
  if (starPoints) { scene.remove(starPoints); starPoints.geometry.dispose(); starPoints.material.dispose(); }
  const N = 800;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    const r     = 90 + Math.random() * 110;
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = Math.abs(r * Math.cos(phi)) + 10;
    pos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    // slight color variation: blue-white to warm-white
    const t = Math.random();
    col[i*3]   = 0.85 + t * 0.15;
    col[i*3+1] = 0.88 + t * 0.12;
    col[i*3+2] = 1.0;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  starPoints = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.28, sizeAttenuation: true, transparent: true, opacity: 0,
    vertexColors: true
  }));
  scene.add(starPoints);
}

// ── Zone system ────────────────────────────────────────────────
function getZoneIdx(sc) {
  let z = 0;
  for (let i = 0; i < ZONES.length; i++) { if (sc >= ZONES[i].minScore) z = i; }
  return z;
}

function applyZone(zi, flash = true) {
  const z = ZONES[zi];
  scene.background = new THREE.Color(z.bg);
  scene.fog = new THREE.FogExp2(z.fog, z.fogD);
  if (ambientLight) { ambientLight.color.set(z.ambC); ambientLight.intensity = z.ambI; }

  if (flash) {
    $('zone-emoji').textContent = z.emoji;
    $('zone-name').textContent  = z.name;
    const zf = $('zone-flash');
    zf.classList.remove('show'); void zf.offsetWidth; zf.classList.add('show');
  }
}

function checkZone(sc) {
  const zi = getZoneIdx(sc);
  if (zi !== currentZoneIdx) {
    currentZoneIdx = zi;
    applyZone(zi, true);
  }
  // Update altitude bar (cap at 100 for fill)
  const pct = Math.min(sc / 100, 1) * 100;
  $('alt-fill').style.height = pct + '%';
  // Update star opacity
  const targetOpa = ZONES[zi].starOpa;
  if (starPoints) starPoints.material.opacity += (targetOpa - starPoints.material.opacity) * 0.05;
  // Milestone check

    const m = MILESTONES[sc];

    // Extra particle burst for milestone

    beep(1046, 0.15, 'sine', 0.18);
    setTimeout(() => beep(1318, 0.15, 'sine', 0.15), 120);
    setTimeout(() => beep(1568, 0.25, 'sine', 0.12), 240);
  }
}

// ── Lean physics ───────────────────────────────────────────────
const LEAN_SPRING = 1.4, LEAN_DAMP = 0.86, LEAN_MAX = 2.0;

function tickLean(dt) {
  if (stack.length < 6) return;
  lean.vx += -lean.x * LEAN_SPRING * dt;
  lean.vz += -lean.z * LEAN_SPRING * dt;
  const dk = Math.pow(LEAN_DAMP, dt * 60);
  lean.vx *= dk; lean.vz *= dk;
  lean.x  += lean.vx * dt;
  lean.z  += lean.vz * dt;
  const mag = Math.sqrt(lean.x*lean.x + lean.z*lean.z);
  if (mag > LEAN_MAX) { lean.x = lean.x/mag*LEAN_MAX; lean.z = lean.z/mag*LEAN_MAX; }
  // Lean danger ring
  const danger = Math.min(mag / LEAN_MAX, 1);
  const ring = $('lean-ring');
  if (danger > 0.25) {
    const d = (danger - 0.25) / 0.75;
    ring.style.opacity = d;
    ring.style.borderColor = `hsl(${20 - d*20},100%,${50 + d*20}%)`;
    ring.style.boxShadow = `inset 0 0 ${30*d}px hsla(${20-d*20},100%,60%,${0.2*d})`;
  } else {
    ring.style.opacity = 0;
  }
}

function applyLeanImpulse(deltaX, deltaZ) {
  const ht = Math.min(stack.length / 35, 2.0);
  lean.vx += deltaX * 0.3 * ht;
  lean.vz += deltaZ * 0.3 * ht;
}

function tickWind(dt) {
  if (score < 15) return;
  windTimer -= dt;
  if (windTimer <= 0) {
    const baseInterval = Math.max(4, 10 - score * 0.06);
    windTimer = baseInterval + (Math.random() - 0.5) * 2;
    const force = (0.5 + Math.random() * 0.7) * Math.min(score / 25, 2.0);
    const angle = Math.random() * Math.PI * 2;
    lean.vx += Math.cos(angle) * force;
    lean.vz += Math.sin(angle) * force;
    // Show wind warning
    const ww = $('wind-warn');
    ww.classList.remove('show'); void ww.offsetWidth; ww.classList.add('show');
    haptic([20, 30, 20]);
  }
}

// ── Block type UI ──────────────────────────────────────────────
function refreshBlockBadge() {
  const badge = $('block-type-badge');
  if (nextBlockType === 'NORMAL') { badge.classList.add('hidden'); return; }
  const bt = BTYPES[nextBlockType];
  badge.textContent = bt.label;
  badge.style.color = bt.color;
  badge.style.borderColor = bt.color;
  badge.style.boxShadow = `0 0 10px ${bt.color}55`;
  badge.classList.remove('hidden');
  badge.classList.remove('pop'); void badge.offsetWidth; badge.classList.add('pop');
}

// ── Init ───────────────────────────────────────────────────────
function initGame() {
  stack.forEach(b => disposeMesh(b.mesh)); stack = [];
  disposeMesh(slider?.mesh); slider = null;
  particles.forEach(p => { p.mesh.removeFromParent(); p.mat.dispose(); }); particles = [];
  fallers.forEach(f => disposeMesh(f.mesh)); fallers = [];

  score = 0; speed = BASE_SPD; slideAxis = 'x'; slideDir = 1; lookY = 2; camY = 16;
  perfectCount = 0; comboCount = 0; maxCombo = 0;

  // Reset lean + wind
  lean.x = 0; lean.z = 0; lean.vx = 0; lean.vz = 0;
  windTimer = 8;

  // Reset block types
  currentBlockType = 'NORMAL';
  nextBlockType    = pickNextBlockType(0);
  refreshBlockBadge();

  // Reset zone
  currentZoneIdx = 0;
  applyZone(0, false);
  $('alt-fill').style.height = '0%';
  $('lean-ring').style.opacity = 0;

  // Init stars
  initStars();

  const base = makeMesh(START_W, START_W, 0, false);
  base.position.set(0, blockY(0), 0);
  scene.add(base);
  stack.push({ mesh: base, cx: 0, cz: 0, w: START_W, d: START_W, colorIdx: 0 });

  camera.position.set(CAM_X, camY, CAM_Z);
  camera.lookAt(0, lookY, 0);
  updateHUD();
  nextSlider();
}

// ── Spawn slider ───────────────────────────────────────────────
function nextSlider() {
  const prev = stack[stack.length - 1];
  const ci   = stack.length % PAL.length;
  const y    = blockY(stack.length);

  // Advance block type
  currentBlockType = nextBlockType;
  nextBlockType    = pickNextBlockType(score);
  refreshBlockBadge();

  const bt = BTYPES[currentBlockType];

  // WIDE block: restore some lost width
  let w = prev.w, d = prev.d;
  if (currentBlockType === 'WIDE') {
    w = Math.min(prev.w * bt.widthMult, START_W);
    d = Math.min(prev.d * bt.widthMult, START_W);
  }

  slideAxis = (stack.length % 2 === 1) ? 'x' : 'z';
  slideDir  = 1;

  const mesh = makeMesh(w, d, ci, true);

  // BOMB/TURBO/STICKY: tint the emissive
  if (bt.color) {
    const col = new THREE.Color(bt.color);
    mesh.material[2].emissive = col;
    mesh.material[2].emissiveIntensity = 0.6;
  }

  // BOMB: add pulsing ring of sparkles
  const startX = slideAxis === 'x' ? prev.cx - START_W * 2 : prev.cx;
  const startZ = slideAxis === 'z' ? prev.cz - START_W * 2 : prev.cz;
  mesh.position.set(startX, y, startZ);
  scene.add(mesh);

  const effectivePerfectT = PERFECT_T * bt.perfectMult;
  speed = Math.min(BASE_SPD + score * 0.15, MAX_SPD) * bt.speedMult;
  slider = { mesh, w, d, colorIdx: ci, blockType: currentBlockType, effectivePerfectT };
  updateSpeedBar();

  // Announce special block type with a beep
  if (currentBlockType !== 'NORMAL') {
    const freqs = { WIDE:440, STICKY:550, TURBO:660, BOMB:330 };
    beep(freqs[currentBlockType] || 440, 0.1, 'sine', 0.09);
  }
}

// ── Place ──────────────────────────────────────────────────────
function place() {
  if (!slider || phase !== 'playing') return;
  const s = slider, prev = stack[stack.length - 1];
  const bt = BTYPES[s.blockType || 'NORMAL'];
  const ept = s.effectivePerfectT || PERFECT_T;
  let newCX, newCZ, newW, newD, perfect = false;

  // Lean offset shifts the effective "center" for PERFECT detection
  const leanOffX = slideAxis === 'x' ? lean.x * 0.35 : 0;
  const leanOffZ = slideAxis === 'z' ? lean.z * 0.35 : 0;

  if (slideAxis === 'x') {
    const sL = s.mesh.position.x - s.w/2, sR = s.mesh.position.x + s.w/2;
    const pL = prev.cx - prev.w/2,        pR = prev.cx + prev.w/2;
    const oL = Math.max(sL, pL), oR = Math.min(sR, pR), ov = oR - oL;
    if (ov <= 0) {
      if (bt.isBomb) { bombMiss(); return; }
      gameOver(); return;
    }
    const delta = s.mesh.position.x - (prev.cx + leanOffX);
    perfect = Math.abs(delta) < ept;
    if (perfect) { newCX = prev.cx; newW = prev.w; }
    else {
      newCX = (oL + oR) / 2; newW = ov;
      const cW = s.w - ov, cX = delta > 0 ? sR - cW/2 : sL + cW/2;
      spawnFaller(cX, s.mesh.position.y, s.mesh.position.z, cW, s.d, s.colorIdx);
      applyLeanImpulse(delta * 0.5, 0);
    }
    newCZ = prev.cz; newD = prev.d;
  } else {
    const sF = s.mesh.position.z - s.d/2, sB = s.mesh.position.z + s.d/2;
    const pF = prev.cz - prev.d/2,        pB = prev.cz + prev.d/2;
    const oF = Math.max(sF, pF), oB = Math.min(sB, pB), ov = oB - oF;
    if (ov <= 0) {
      if (bt.isBomb) { bombMiss(); return; }
      gameOver(); return;
    }
    const delta = s.mesh.position.z - (prev.cz + leanOffZ);
    perfect = Math.abs(delta) < ept;
    if (perfect) { newCZ = prev.cz; newD = prev.d; }
    else {
      newCZ = (oF + oB) / 2; newD = ov;
      const cD = s.d - ov, cZ = delta > 0 ? sB - cD/2 : sF + cD/2;
      spawnFaller(s.mesh.position.x, s.mesh.position.y, cZ, s.w, cD, s.colorIdx);
      applyLeanImpulse(0, delta * 0.5);
    }
    newCX = prev.cx; newW = prev.w;
  }

  if (newW < MIN_SIZE || newD < MIN_SIZE) { gameOver(); return; }

  // BOMB perfect: restore block size toward START_W
  if (bt.isBomb && perfect) {
    newW = Math.min(newW * 1.6, START_W * 0.85);
    newD = Math.min(newD * 1.6, START_W * 0.85);
    burst(newCX ?? 0, blockY(stack.length) + BH/2, newCZ ?? 0, 0xf87171, 35);
    burst(newCX ?? 0, blockY(stack.length) + BH/2, newCZ ?? 0, 0xfbbf24, 20);
  }

  const idx = stack.length, y = blockY(idx);
  const mesh = makeMesh(newW, newD, s.colorIdx, false);
  mesh.position.set(newCX, y, newCZ);
  scene.add(mesh);
  stack.push({ mesh, cx: newCX, cz: newCZ, w: newW, d: newD, colorIdx: s.colorIdx });

  disposeMesh(s.mesh); slider = null;
  const bonusScore = bt.scoreBonus || 0;
  score += 1 + bonusScore;
  if (perfect) {
    perfectCount++;
    comboCount++;
    if (comboCount > maxCombo) maxCombo = comboCount;
  } else {
    comboCount = 0;
  }
  if (score > best) best = score;
  updateHUD(); popScore(); playSFX(perfect);
  if (perfect) { flashPerfect(); if (comboCount >= 2) flashCombo(comboCount); }
  haptic(perfect ? [30, 20, 30] : [15]);
  checkZone(score);

  burst(newCX, y + BH/2, newCZ, PAL[s.colorIdx % PAL.length].em, perfect ? 26 : 10);
  fill.position.y = y + 4;
  lookY = y + 2;
  nextSlider();
}

// ── Bomb miss ──────────────────────────────────────────────────
function bombMiss() {
  // BOMB missed completely: spectacular explosion then game over
  phase = 'exploding'; // prevent further input
  if (slider) { disposeMesh(slider.mesh); slider = null; }
  const topY = blockY(stack.length - 1) + BH/2;
  for (let i = 0; i < 4; i++) {
    setTimeout(() => {
      burst(
        (Math.random()-.5)*3, topY + i*0.5, (Math.random()-.5)*3,
        [0xf87171, 0xfbbf24, 0xfde68a][i%3], 18
      );
    }, i * 80);
  }
  beep(80, 0.4, 'sawtooth', 0.2);
  setTimeout(() => gameOver(), 380);
}

// ── Game over ──────────────────────────────────────────────────
function gameOver() {
  phase = 'gameover';
  playSFXFail();
  haptic([100]);
  if (slider) { disposeMesh(slider.mesh); slider = null; }
  burst(0, blockY(stack.length - 1) + BH/2, 0, 0xf87171, 28);
  hintEl.classList.add('gone');
  $('btn-pause').style.display = 'none';
  $('block-type-badge').classList.add('hidden');
  $('lean-ring').style.opacity = 0;

  const wasRecord = score > 0 && score >= (loadScores()[0] || 0);
  const scores = saveScore(score);
  if (score > best) best = score;

  goScore.textContent  = score;
  goBest.textContent   = wasRecord ? '🏆 新記録！' : '';
  goPerfect.textContent= perfectCount;
  goCombo.textContent  = maxCombo;
  bestEl.textContent   = best;

  // Build score list
  goScoreList.innerHTML = '';
  scores.slice(0, 5).forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'go-score-row' + (s === score && i === scores.indexOf(score) ? ' current' : '');
    row.innerHTML = `<span class="go-score-rank">#${i+1}</span><span class="go-score-num">${s}</span>`;
    goScoreList.appendChild(row);
  });

  setTimeout(() => goScr.classList.remove('hidden'), 800);
}

// ── HUD ────────────────────────────────────────────────────────
function updateHUD()    { scoreEl.textContent = score; bestEl.textContent = best; }
function popScore()     { scoreEl.classList.remove('pop'); void scoreEl.offsetWidth; scoreEl.classList.add('pop'); setTimeout(() => scoreEl.classList.remove('pop'), 260); }
function flashPerfect() { perfectEl.classList.remove('show'); void perfectEl.offsetWidth; perfectEl.classList.add('show'); }
function flashCombo(n)  {
  comboEl.textContent = n + 'x COMBO!';
  comboEl.classList.remove('show'); void comboEl.offsetWidth; comboEl.classList.add('show');
}
function updateSpeedBar() {
  const p = ((speed - BASE_SPD) / (MAX_SPD - BASE_SPD)) * 88 + 12;
  spdFill.style.width = p + '%';
}
function haptic(pattern) {
  if (navigator.vibrate) try { navigator.vibrate(pattern); } catch(_) {}
}

// ── Audio ──────────────────────────────────────────────────────
let actx = null;
function ensureAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  actx.resume();
}
function beep(freq, dur, type = 'sine', vol = 0.1) {
  if (!actx || muted) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(_) {}
}
function playSFX(perfect) {
  const f = 300 + score * 14;
  if (perfect) {
    beep(880, 0.1, 'sine', 0.17); setTimeout(() => beep(1320, 0.12, 'sine', 0.12), 65); setTimeout(() => beep(1760, 0.18, 'sine', 0.08), 135);
  } else { beep(Math.min(f, 680), 0.08, 'square', 0.07); }
}
function playSFXFail() {
  beep(200, 0.08, 'sawtooth', 0.13); setTimeout(() => beep(140, 0.12, 'sawtooth', 0.1), 85); setTimeout(() => beep(90, 0.22, 'sawtooth', 0.07), 185);
}

// ── Mute toggle ────────────────────────────────────────────────
$('btn-mute').addEventListener('click', e => {
  e.stopPropagation();
  muted = !muted;
  $('btn-mute').textContent = muted ? '🔇' : '🔊';
  $('btn-mute').classList.toggle('muted', muted);
});

// ── Pause / Resume ─────────────────────────────────────────────
function togglePause() {
  if (phase !== 'playing' && phase !== 'paused') return;
  if (phase === 'playing') {
    phase = 'paused';
    pauseOvl.classList.remove('hidden');
    $('btn-pause').textContent = '▶';
  } else {
    phase = 'playing';
    pauseOvl.classList.add('hidden');
    $('btn-pause').textContent = '⏸';
  }
}
$('btn-pause').addEventListener('click',  e => { e.stopPropagation(); togglePause(); });
$('btn-resume').addEventListener('click', e => { e.stopPropagation(); togglePause(); });
document.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); togglePause(); }
});

// ── Countdown ──────────────────────────────────────────────────
function runCountdown(cb) {
  countdownEl.classList.remove('hidden');
  let n = 3;
  function tick() {
    cdVal.textContent = n > 0 ? n : 'GO!';
    // re-trigger animation
    cdVal.style.animation = 'none';
    void cdVal.offsetWidth;
    cdVal.style.animation = '';
    if (n > 0) {
      beep(440 + n * 110, 0.12, 'sine', 0.12);
      n--;
      setTimeout(tick, 700);
    } else {
      beep(880, 0.2, 'sine', 0.18);
      setTimeout(() => {
        countdownEl.classList.add('hidden');
        cb();
      }, 650);
    }
  }
  tick();
}

// ── Main loop ──────────────────────────────────────────────────
let lastTs = 0;
(function mainLoop(rawTs) {
  requestAnimationFrame(mainLoop);
  const dt = Math.min((rawTs - lastTs) / 1000, 0.05);
  lastTs = rawTs;

  fpsFrames++; fpsSec += dt;
  if (fpsSec >= 1) {
    fpsDisplay = Math.round(fpsFrames / fpsSec);
    fpsFrames = 0; fpsSec = 0;
    const ri = renderer.info;
    dbgEl.textContent = `FPS ${fpsDisplay}  Draw ${ri.render.calls}  Tri ${(ri.render.triangles/1000).toFixed(1)}k`;
  }

  if (phase === 'playing' || phase === 'paused' || phase === 'exploding') {
    if (phase !== 'paused') {
    // Lean & wind (only during active play)
    if (phase === 'playing') { tickLean(dt); tickWind(dt); }

    // Slider movement — center shifted by lean offset
    if (slider) {
      const s = slider, prev = stack[stack.length - 1];
      const trv = speed * dt * slideDir, lim = START_W * 1.7;
      // lean shifts the oscillation center
      const leanCX = prev.cx + lean.x * 0.35;
      const leanCZ = prev.cz + lean.z * 0.35;
      if (slideAxis === 'x') {
        s.mesh.position.x += trv;
        if (s.mesh.position.x > leanCX + lim) slideDir = -1;
        if (s.mesh.position.x < leanCX - lim) slideDir =  1;
      } else {
        s.mesh.position.z += trv;
        if (s.mesh.position.z > leanCZ + lim) slideDir = -1;
        if (s.mesh.position.z < leanCZ - lim) slideDir =  1;
      }
      // Float + emissive pulse (speed up for TURBO, pulse color for BOMB)
      const floatAmp = currentBlockType === 'TURBO' ? 0.09 : 0.045;
      s.mesh.position.y = blockY(stack.length) + Math.sin(rawTs * 0.0025) * floatAmp;
      const emiBase = currentBlockType === 'BOMB' ? 0.5 : 0.3;
      const emiAmp  = currentBlockType === 'BOMB' ? 0.45 : 0.25;
      const emi = emiBase + emiAmp * Math.sin(rawTs * (currentBlockType === 'BOMB' ? 0.008 : 0.004));
      if (s.mesh.material[2]?.emissive) s.mesh.material[2].emissiveIntensity = emi;
    }

    tickParticles(dt);
    tickFallers(dt);

    // Camera: slight tilt toward lean direction
    const tCamY = Math.max(16, (lookY - 2) + 16);
    camY += (tCamY - camY) * Math.min(dt * 3, 1);
    const camLookX = lean.x * 0.15;
    const camLookZ = lean.z * 0.15;
    camera.position.set(CAM_X, camY, CAM_Z);
    camera.lookAt(camLookX, lookY, camLookZ);

    // Point light slow drift
    fill.position.x = Math.sin(rawTs * 0.0005) * 2;
    fill.position.z = Math.cos(rawTs * 0.0005) * 2;
    } // end not paused
  }

  renderer.info.reset();
  composer.render();
})(0);

// ── Input ──────────────────────────────────────────────────────
const canPlace = () => phase === 'playing';
renderer.domElement.addEventListener('click',      ()   => { if (canPlace()) place(); });
renderer.domElement.addEventListener('touchstart', e    => { e.preventDefault(); if (canPlace()) place(); }, { passive: false });
document.addEventListener('keydown',               e    => {
  if (e.code === 'Space') { e.preventDefault(); if (canPlace()) place(); }
});

// ── Start / Restart ────────────────────────────────────────────
function startGame() {
  ensureAudio();
  phase = 'countdown';
  startScr.classList.add('hidden');
  startCvs.classList.add('gone');
  goScr.classList.add('hidden');
  hintEl.classList.add('gone');
  initGame();
  runCountdown(() => {
    phase = 'playing';
    hintEl.classList.remove('gone');
    $('btn-pause').style.display = 'flex';
  });
}
$('btn-start').addEventListener('click',   e => { e.stopPropagation(); startGame(); });
$('btn-restart').addEventListener('click', e => { e.stopPropagation(); startGame(); });

// Init best score display
bestEl.textContent = best;

// ── Test hooks ─────────────────────────────────────────────────
window.render_game_to_text = () => JSON.stringify({
  phase, score, stackLen: stack.length, axis: slideAxis,
  sliderX: slider ? +slider.mesh.position.x.toFixed(2) : null,
  sliderZ: slider ? +slider.mesh.position.z.toFixed(2) : null,
  topW: stack.length ? +stack[stack.length-1].w.toFixed(2) : null,
  topD: stack.length ? +stack[stack.length-1].d.toFixed(2) : null,
});
</script>
<script data-pplx-inline-edit>
(function(){
  if(window===window.top)return;
  function inlineAll(orig,clone){
    if(orig.nodeType!==1)return;
    try{
      var cs=getComputedStyle(orig);
      var t='';
      for(var i=0;i<cs.length;i++){t+=cs[i]+':'+cs.getPropertyValue(cs[i])+';';}
      clone.style.cssText=t;
    }catch(e){}
    var oc=orig.children,cc=clone.children;
    for(var j=0;j<oc.length&&j<cc.length;j++){inlineAll(oc[j],cc[j]);}
  }
  function stripExternal(clone){
    var imgs=clone.querySelectorAll('img');
    for(var i=0;i<imgs.length;i++){
      var s=imgs[i].getAttribute('src');
      if(s&&!s.startsWith('data:'))imgs[i].removeAttribute('src');
    }
    var all=clone.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
      var st=all[i].style.cssText;

        all[i].style.cssText=st.replace(/url\(["']?(?!data:)[^)"']*["']?\)/gi,'none');
      }
    }
  }
  window.addEventListener('message',function(e){
    if(!e.data||e.data.type!=='INLINE_EDIT_CAPTURE_REQUEST')return;
    var scrollX=window.scrollX||window.pageXOffset||0;
    var scrollY=window.scrollY||window.pageYOffset||0;
    var w=window.innerWidth,h=window.innerHeight;

      for(var i=0;i<rm.length;i++){rm[i].remove();}
      inlineAll(document.documentElement,clone);
      stripExternal(clone);
      var html=new XMLSerializer().serializeToString(clone);
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
        +'<foreignObject width="100%" height="100%">'
        +'<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+w+'px;height:'+h+'px;overflow:hidden">'
        +'<div style="transform:translate(-'+scrollX+'px,-'+scrollY+'px);transform-origin:top left">'
        +html+'</div></div></foreignObject></svg>';
      var svgUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
      var img=new Image();
      img.onload=function(){
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0);
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:c.toDataURL('image/png'),scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.onerror=function(){
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.src=svgUrl;
    }catch(err){
      window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
    }
  });
})();
